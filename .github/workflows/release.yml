name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Write checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi:
    # Opt-in only. A fresh repo has no PyPI Trusted Publisher registered, so an
    # always-on job would fail the first release with `invalid-publisher`. Set
    # the PYPI_PUBLISH repository variable to 'true' and register the Trusted
    # Publisher (workflow `release.yml`, environment `pypi`) to enable it.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paiban
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Drop non-distribution files
        run: rm -f dist/checksums.txt
      - uses: pypa/gh-action-pypi-publish@release/v1
