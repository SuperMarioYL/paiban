[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paiban"
version = "0.1.0"
description = "Chinese typography engine that turns long documents into WPS-native, editable .pptx decks."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "chinese-typography",
    "cjk",
    "pptx",
    "wps",
    "ooxml",
    "document-conversion",
    "cli",
    "skill",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "python-pptx>=1.0,<2",
    "python-docx>=1.1,<2",
    "lxml>=5.2,<6",
    "openai>=1.60,<2",
    "typer>=0.12,<0.13",
    # typer 0.12.x targets Click's pre-8.2 parameter API: Click 8.2 changed
    # Parameter.make_metavar() to require a ctx argument, which makes typer
    # 0.12 crash while rendering command help. Pin the transitive dep so a
    # clean install cannot resolve Click 8.2+.
    "click>=8.1,<8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/paiban"
Repository = "https://github.com/SuperMarioYL/paiban"
Issues = "https://github.com/SuperMarioYL/paiban/issues"

[project.scripts]
paiban = "paiban.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paiban"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put src/ on sys.path so the suite collects and runs straight from a clone,
# whether or not `pip install -e .` ran first.
pythonpath = ["src"]
