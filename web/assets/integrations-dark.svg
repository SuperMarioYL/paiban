="12.5" fill="#95b2c4" font-weight="400" text-anchor="middle" opacity="1">build · verify · fix</text><rect x="40" y="60" width="260" height="64" rx="14" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="56" y="88" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#56c2e6" font-weight="700" text-anchor="start" opacity="1">输入</text><text x="56" y="110" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">markdown / txt / docx</text><rect x="700" y="60" width="260" height="64" rx="14" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="716" y="88" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#56c2e6" font-weight="700" text-anchor="start" opacity="1">输出</text><text x="716" y="110" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">.pptx 标准 OOXML</text><rect x="20" y="218" width="260" height="64" rx="14" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="36" y="246" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#56c2e6" font-weight="700" text-anchor="start" opacity="1">模板族</text><text x="36" y="268" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">report / courseware</text><rect x="720" y="218" width="260" height="64" rx="14" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="736" y="246" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#56c2e6" font-weight="700" text-anchor="start" opacity="1">交付面</text><text x="736" y="268" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">WPS Office 2019+ / WPS 365</text><rect x="40" y="368" width="260" height="64" rx="14" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="56" y="396" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#56c2e6" font-weight="700" text-anchor="start" opacity="1">Agent 宿主</text><text x="56" y="418" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">skill/SKILL.md</text><rect x="700" y="368" width="260" height="64" rx="14" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="716" y="396" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#56c2e6" font-weight="700" text-anchor="start" opacity="1">可选模型</text><text x="716" y="418" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">DeepSeek（无 key 降级 rules）</text><text x="32" y="456" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">生成物不驱动 WPS 进程、不要求装插件；模板族 v0.1 只内置两个。</text></svg>
