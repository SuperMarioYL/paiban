<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="56c2e6-6a85e7-acf6ed-c762d828d33d" role="img" aria-labelledby="integrations-dark.svg-title integrations-dark.svg-desc"><title id="integrations-dark.svg-title">命令、Agent Skill、模板族与 WPS 的接入关系</title><desc id="integrations-dark.svg-desc">How the CLI, the agent skill, the template families and WPS connect.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="470"><stop stop-color="#56c2e6"/><stop offset=".55" stop-color="#6a85e7"/><stop offset="1" stop-color="#acf6ed"/></linearGradient><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56c2e6" stop-opacity=".28"/><stop offset="1" stop-color="#6a85e7" stop-opacity=".06"/></linearGradient><radialGradient id="halo"><stop stop-color="#56c2e6" stop-opacity="0.2"/><stop offset="1" stop-color="#56c2e6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173341" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.pulse{animation:pulse 5s ease-in-out infinite}.dash{stroke-dasharray:9 120;animation:flow 7s linear infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-260}}@media(prefers-reduced-motion:reduce){.pulse,.dash{animation:none}}</style><rect width="1000" height="470" rx="16" fill="#050b12"/><rect width="1000" height="470" rx="16" fill="url(#grid)" opacity="0.5"/><text x="32" y="34" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#56c2e6" font-weight="700" tex