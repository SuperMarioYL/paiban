<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="56c2e6-6a85e7-acf6ed-c762d828d33d" role="img" aria-labelledby="demo-2-dark.svg-title demo-2-dark.svg-desc"><title id="demo-2-dark.svg-title">读回 slide2.xml 的版式属性</title><desc id="demo-2-dark.svg-desc">Recorded step: the layout attributes read back from slide2.xml.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="300"><stop stop-color="#56c2e6"/><stop offset=".55" stop-color="#6a85e7"/><stop offset="1" stop-color="#acf6ed"/></linearGradient><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56c2e6" stop-opacity=".28"/><stop offset="1" stop-color="#6a85e7" stop-opacity=".06"/></linearGradient><radialGradient id="halo"><stop stop-color="#56c2e6" stop-opacity="0.2"/><stop offset="1" stop-color="#56c2e6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173341" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.pulse{animation:pulse 5s ease-in-out infinite}.dash{stroke-dasharray:9 120;animation:flow 7s linear infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-260}}@media(prefers-reduced-motion:reduce){.pulse,.dash{animation:none}}</style><rect width="760" height="300" rx="16" fill="#050b12"/><rect width="760" height="300" rx="16" fill="url(#grid)" opacity="0.5"/><text x="24" y="36" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">不用打开 WPS 也能确认版式落在属性上 —— 直接看文件里的 XML：</text><rect x="24" y="48" width="712" height="76" rx="14" fill="#0a141d" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="40" y="74" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#eefdfb" font-weight="400" text-anchor="start" opacity="1">$ unzip -p 课件.pptx \</text><text x="72" y="92" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#eefdfb" font-weight="400" text-anchor="start" opacity="1">ppt/slides/slide2.xml | \</text><text x="72" y="110" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#eefdfb" font-weight="400" text-anchor="start" opacity="1">grep -oE &#39;(a:ea typeface|spcPct val|indent)=&quot;[^&quot;]*&quot;&#39; | sort -u</text><rect x="24" y="148" width="340" height="34" rx="8" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="40" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#56c2e6" font-weight="600" text-anchor="start" opacity="1">a:ea typeface=&quot;Microsoft YaHei&quot;</text><g stroke="#56c2e6" stroke-width="1.6" fill="none"><path d="M372 165H397"/><path d="M397 160.5L404 165L397 169.5" fill="#56c2e6" stroke="none"/></g><text x="414" y="170" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">东亚字体槽：中文不会落到方块字体上</text><rect x="24" y="192" width="340" height="34" rx="8" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="40" y="214" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#56c2e6" font-weight="600" text-anchor="start" opacity="1">indent=&quot;558800&quot;</text><g stroke="#56c2e6" stroke-width="1.6" fill="none"><path d="M372 209H397"/><path d="M397 204.5L404 209L397 213.5" fill="#56c2e6" stroke="none"/></g><text x="414" y="214" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">22pt 字号下 2 字符的首行缩进</text><rect x="24" y="236" width="340" height="34" rx="8" fill="#0c151f" stroke="#173341" stroke-width="1.2" opacity="1"/><text x="40" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#56c2e6" font-weight="600" text-anchor="start" opacity="1">spcPct val=&quot;150000&quot;</text><g stroke="#56c2e6" stroke-width="1.6" fill="none"><path d="M372 253H397"/><path d="M397 248.5L404 253L397 257.5" fill="#56c2e6" stroke="none"/></g><text x="414" y="258" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">行距 1.5</text><text x="24" y="292" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#95b2c4" font-weight="400" text-anchor="start" opacity="1">indent = 2 × 22pt × 12700 EMU/pt；spcPct 150000 = 行距 1.5。</text></svg>
